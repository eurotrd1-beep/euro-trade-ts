name: Deploy to GitHub Pages

# EVERY PUSH TO `main` PUBLISHES. That is now the intent, not an accident.
#
# It was manual-only while the port was catching up: publishing here REPLACES
# the live site users are on, and a few presentation sections of the main
# screen were still missing, so going live had to be a decision. That has been
# turned around deliberately — the deploy is wanted on every commit now.
#
# What did NOT change is the gate. `verify` still runs the engine parity suite
# and all three typechecks, and `build` only runs if it passed, and `deploy`
# only if the build did. A commit that would change the signals users receive
# fails before anything is published — the site stays on the last good deploy.
#
# So the rule to work by: main is live. Push to a branch while a change is in
# progress, and merge when it is meant to be seen.
#
# `workflow_dispatch` stays, for re-publishing the same commit without an
# empty one — Actions → "Deploy to GitHub Pages" → Run workflow.
# To go back to manual-only, comment the `push:` block out again.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the newer one wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    name: Parity tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The gate: every indicator and the whole pyramid must still match the
      # values recorded from the live Dart engine. A failure here means the
      # signals users receive would change — the deploy must not proceed.
      - name: Engine parity suite
        run: npm --workspace @euro/engine run test

      - name: Typecheck
        run: |
          npm --workspace @euro/engine run typecheck
          npm --workspace @euro/shared run typecheck
          npm --workspace @euro/web run typecheck

  build:
    name: Build
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Diagnostics, so a "command not found" says WHICH command instead of
      # just exit 127. Cheap, and it turns a guessing game into a fact.
      - name: Environment
        run: |
          echo "node:  $(node -v)"
          echo "npm:   $(npm -v)"
          echo "next:  $(node -e "console.log(require.resolve('next/dist/bin/next'))" || echo 'NOT RESOLVABLE')"
          ls -d node_modules/next apps/web/node_modules 2>/dev/null || true

      - name: Build static site
        env:
          # GitHub Pages serves project sites from /<repo>/, so every asset URL
          # needs that prefix. Without it the page loads blank.
          EURO_BASE_PATH: /${{ github.event.repository.name }}
        # Run through npm rather than `node scripts/...` directly: npm puts the
        # workspace's and the root's node_modules/.bin on PATH, which removes
        # the whole class of "binary not found" failures regardless of how the
        # dependency happens to be hoisted.
        run: npm --workspace @euro/web run build:static

      # `_next/` starts with an underscore, which Jekyll would skip. The Pages
      # Actions pipeline does not run Jekyll, but this costs nothing and removes
      # a classic blank-page failure mode.
      - name: Disable Jekyll
        run: touch apps/web/out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
